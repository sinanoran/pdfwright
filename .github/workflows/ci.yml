name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # The library writes a file format, so it is worth knowing it writes the same one everywhere.
    # Windows, Linux and macOS differ in line endings, path separators, fonts on the machine (the library
    # must not depend on them) and in the native HarfBuzz library that is loaded.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # The SDK comes from global.json (11); the tests also run on the runtimes of net8.0, net9.0 and net10.0.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # qpdf checks the structure of every generated file (tests/Pdfwright.Tests/Pdf). It is installed on every runner and
      # PDFWRIGHT_REQUIRE_QPDF makes its absence a failure: a check that can be silently missing checks nothing.
      - name: Install qpdf
        shell: bash
        run: |
          # The package feeds fail now and then (a Chocolatey 5xx failed a run without failing this step): try three times,
          # and fail here, with the reason, if qpdf is still not on the path.
          install() {
            case "$RUNNER_OS" in
              Linux) sudo apt-get update && sudo apt-get install -y qpdf ;;
              macOS) brew install qpdf ;;
              Windows) choco install qpdf -y --no-progress ;;
            esac
          }
          for attempt in 1 2 3; do
            install && break
            echo "qpdf install attempt $attempt failed"; sleep $((attempt * 15))
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Chocolatey puts the shim on the machine path, which this shell does not see until the next step.
            ls "/c/ProgramData/chocolatey/bin/qpdf.exe" >/dev/null 2>&1 || ls /c/Program Files/qpdf*/bin/qpdf.exe >/dev/null 2>&1 || { echo "qpdf was not installed"; exit 1; }
          else
            command -v qpdf >/dev/null || { echo "qpdf was not installed"; exit 1; }
          fi

      # veraPDF validates the tagged documents against PDF/UA-1 (tests/Pdfwright.Tests/Document/PdfUAValidationTests.cs). It is a Java program and a
      # test-time tool, run on this leg only: the goldens already prove that the bytes are the same on every system.
      - uses: actions/setup-java@v6
        if: matrix.os == 'ubuntu-latest'
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache veraPDF
        id: verapdf-cache
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/verapdf
          key: verapdf-1.30.4-${{ runner.os }}

      - name: Install veraPDF
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          # A pinned release, the one the tests were last validated with locally, and the SHA-256 of its installer archive: a new version is a
          # change of this file (version, URL, hash and cache key together), never a silent upgrade.
          VERAPDF_VERSION: 1.30.4
          VERAPDF_URL: https://software.verapdf.org/rel/1.30/verapdf-greenfield-1.30.4-installer.zip
          VERAPDF_SHA256: 04415ef3f149526a3048b9889723e81320ddf013bd891bcc7f0f297f3eadcc23
          CACHE_HIT: ${{ steps.verapdf-cache.outputs.cache-hit }}
        run: |
          target="$RUNNER_TEMP/verapdf"
          if [ "$CACHE_HIT" != "true" ]; then
            # The download fails now and then, as the package feeds do: try three times, then the hash check fails with the reason.
            archive="$RUNNER_TEMP/verapdf-installer.zip"
            for attempt in 1 2 3; do
              curl --fail --silent --show-error --location --output "$archive" "$VERAPDF_URL" && break
              echo "veraPDF download attempt $attempt failed"; sleep $((attempt * 15))
            done
            echo "$VERAPDF_SHA256  $archive" | sha256sum --check --strict || { echo "the veraPDF installer is missing or is not the pinned one"; exit 1; }
            unzip -q -o "$archive" -d "$RUNNER_TEMP/verapdf-installer"

            # The installer (IzPack) runs headless from an answer file: the command-line program and what it needs, into $RUNNER_TEMP/verapdf.
            cat > "$RUNNER_TEMP/verapdf-auto-install.xml" <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
              <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
              <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
                  <installpath>$target</installpath>
              </com.izforge.izpack.panels.target.TargetPanel>
              <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
                  <pack index="0" name="veraPDF GUI" selected="true"/>
                  <pack index="1" name="veraPDF Batch files" selected="true"/>
                  <pack index="2" name="veraPDF Validation model" selected="false"/>
                  <pack index="3" name="veraPDF Documentation" selected="false"/>
                  <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
              </com.izforge.izpack.panels.packs.PacksPanel>
              <com.izforge.izpack.panels.install.InstallPanel id="install"/>
              <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
            java -jar "$RUNNER_TEMP/verapdf-installer/verapdf-greenfield-$VERAPDF_VERSION/verapdf-izpack-installer-$VERAPDF_VERSION.jar" "$RUNNER_TEMP/verapdf-auto-install.xml"
          fi

          # A tool that does not run is a failure here, with the reason, not a skipped test later.
          "$target/verapdf" --version || { echo "veraPDF does not run from $target"; ls -la "$target" || true; exit 1; }

      - run: dotnet restore Pdfwright.slnx

      - run: dotnet build Pdfwright.slnx --no-restore --configuration Release

      # Runs the tests of every target framework (net8.0 to net11.0).
      - run: dotnet test Pdfwright.slnx --no-build --configuration Release
        env:
          PDFWRIGHT_REQUIRE_QPDF: "1"
          # veraPDF, installed above on the Linux leg only, where its absence is a failure; elsewhere the PDF/UA tests skip.
          PDFWRIGHT_VERAPDF: ${{ matrix.os == 'ubuntu-latest' && format('{0}/verapdf/verapdf', runner.temp) || '' }}
          PDFWRIGHT_REQUIRE_VERAPDF: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
          # The golden renders go through PDFium; a renderer that cannot load is a failure here, not a skip.
          PDFWRIGHT_REQUIRE_RENDER: "1"
          # One line for each page compared (differing pixels and their share), printed by the next step to see how far the platforms are from the stored PNGs.
          PDFWRIGHT_RENDER_REPORT: ${{ runner.temp }}/pdfwright-actual/render-report.txt
          # A golden test that fails writes the bytes it made here (pdfwright-actual-*.pdf), and the next step keeps them.
          PDFWRIGHT_ACTUAL_DIR: ${{ runner.temp }}/pdfwright-actual

      - name: Show how far each render is from its stored PNG
        if: always()
        shell: bash
        run: sort "${{ runner.temp }}/pdfwright-actual/render-report.txt" | uniq || true

      - name: Keep the files a failing golden test wrote
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-actual-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/pdfwright-actual/pdfwright-actual-*.pdf
            ${{ runner.temp }}/pdfwright-actual/pdfwright-actual-*.png
            ${{ runner.temp }}/pdfwright-actual/pdfwright-diff-*.png
            ${{ runner.temp }}/pdfwright-actual/render-report.txt
          if-no-files-found: ignore

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/Pdfwright/Pdfwright.csproj --no-build --configuration Release --output artifacts

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: artifacts/*

  linux-runtime-images:
    # The runner images above have a full SDK and many libraries installed. A service usually runs on the slim .NET runtime images
    # instead, where only what the runtime needs is present, and on Alpine the C library is musl, not glibc. This job proves that
    # the native shaping library (HarfBuzzSharp) loads there and that a whole report is made: the sample report program, published
    # for the image's runtime identifier, runs inside the image and must write its file with every glyph found.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mcr.microsoft.com/dotnet/aspnet:10.0
            rid: linux-x64
          - image: mcr.microsoft.com/dotnet/aspnet:10.0-alpine
            rid: linux-musl-x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Publish the sample report for ${{ matrix.rid }}
        run: dotnet publish samples/Pdfwright.Samples.Report/Pdfwright.Samples.Report.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained false --output "${{ runner.temp }}/sample"

      - name: Run it in ${{ matrix.image }}
        shell: bash
        run: |
          # The program exits with 1 when a glyph is missing and with another code when anything fails, including the native load.
          mkdir -p "${{ runner.temp }}/out"
          docker run --rm -v "${{ runner.temp }}/sample:/app:ro" -v "${{ runner.temp }}/out:/out" -w /app "${{ matrix.image }}" \
            dotnet Pdfwright.Samples.Report.dll /out/report.pdf
          test -s "${{ runner.temp }}/out/report.pdf"
          head -c 8 "${{ runner.temp }}/out/report.pdf" | grep -q '%PDF-' || { echo "not a PDF file"; exit 1; }

      # Slice C1 of 0.2: the hb-subset entry points (the subsetter of HarfBuzz, for CFF fonts) must be in the same native library, in both images.
      # The probe subsets a font to three glyphs through them and exits with 2 when an export is missing and with 1 when the result is wrong.
      - name: Publish the hb-subset probe for ${{ matrix.rid }}
        run: dotnet publish tools/Pdfwright.NativeProbe/Pdfwright.NativeProbe.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained false --output "${{ runner.temp }}/probe"

      - name: Run the hb-subset probe in ${{ matrix.image }}
        shell: bash
        run: |
          docker run --rm -v "${{ runner.temp }}/probe:/app:ro" -w /app "${{ matrix.image }}" dotnet Pdfwright.NativeProbe.dll
